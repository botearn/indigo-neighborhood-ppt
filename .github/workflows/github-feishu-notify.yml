name: GitHub Feishu Notifications

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - closed
      - review_requested

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    name: Send Feishu notification
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Send card
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "::notice::FEISHU_WEBHOOK_URL is not configured; skipping Feishu notification."
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request


          def truncate(value, limit=90):
              value = value or ""
              return value if len(value) <= limit else value[: limit - 3] + "..."


          def div(content):
              return {"tag": "div", "text": {"tag": "lark_md", "content": content}}


          def note(content):
              return {"tag": "note", "elements": [{"tag": "lark_md", "content": content}]}


          def stat_col(content):
              return {
                  "tag": "column",
                  "width": "weighted",
                  "weight": 1,
                  "vertical_align": "center",
                  "elements": [
                      {"tag": "div", "text": {"tag": "lark_md", "content": content}}
                  ],
              }


          def action_button(text, url, button_type="default"):
              return {
                  "tag": "button",
                  "text": {"tag": "plain_text", "content": text},
                  "url": url,
                  "type": button_type,
              }


          def run_url():
              return (
                  f"{os.environ['GITHUB_SERVER_URL']}/"
                  f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                  f"{os.environ['GITHUB_RUN_ID']}"
              )


          def repo_label():
              return os.environ["GITHUB_REPOSITORY"]


          def push_card(payload):
              if payload.get("deleted"):
                  return None

              branch = payload.get("ref", "").replace("refs/heads/", "") or "unknown"
              pusher = payload.get("pusher", {}).get("name") or os.environ.get("GITHUB_ACTOR", "unknown")
              commits = payload.get("commits") or []
              head_commit = payload.get("head_commit") or {}
              head_msg = (head_commit.get("message") or "").splitlines()[0]
              n_commits = len(commits)
              forced = bool(payload.get("forced"))

              files = set()
              for commit in commits:
                  files.update(commit.get("added") or [])
                  files.update(commit.get("modified") or [])
                  files.update(commit.get("removed") or [])

              prefix = "Force-push" if forced else "Push"
              title = truncate(f"Indigo GitHub | {prefix} to {branch}")
              elements = [
                  div(
                      f"**{truncate(head_msg, 120)}**"
                      if head_msg
                      else f"Repository update on `{branch}`."
                  ),
                  {
                      "tag": "column_set",
                      "flex_mode": "stretch",
                      "horizontal_spacing": "default",
                      "columns": [
                          stat_col(f"**Actor**\n{pusher}"),
                          stat_col(f"**Branch**\n`{branch}`"),
                          stat_col(f"**Scope**\n{n_commits} commits / {len(files)} files"),
                      ],
                  }
              ]

              if commits:
                  lines = []
                  for commit in list(commits)[-5:][::-1]:
                      sha = (commit.get("id") or "")[:7]
                      msg = truncate((commit.get("message") or "").splitlines()[0], 100)
                      commit_url = commit.get("url")
                      if commit_url:
                          lines.append(f"- [`{sha}`]({commit_url}) {msg}")
                      else:
                          lines.append(f"- `{sha}` {msg}")
                  if n_commits > 5:
                      lines.append(f"- ... total {n_commits} commits")
                  elements.append(div("**Recent commits**\n" + "\n".join(lines)))

              elements.append(
                  note(
                      f"Repository: `{repo_label()}`. "
                      + ("Force-push detected; verify branch state." if forced else "Sent by GitHub Actions.")
                  )
              )

              actions = [action_button("Workflow run", run_url(), "default")]
              if payload.get("compare"):
                  actions.insert(0, action_button("View compare", payload["compare"], "primary"))
              if head_commit.get("url"):
                  actions.insert(1, action_button("Latest commit", head_commit["url"], "default"))
              elements.append({"tag": "action", "actions": actions[:3]})

              return {
                  "msg_type": "interactive",
                  "card": {
                      "header": {
                          "title": {"tag": "plain_text", "content": title},
                          "template": "red" if forced else "blue",
                      },
                      "elements": elements,
                  },
              }


          def pull_request_card(payload):
              action = payload.get("action") or "updated"
              pr = payload.get("pull_request") or {}
              number = pr.get("number") or payload.get("number") or ""
              title_text = pr.get("title") or ""
              user = (pr.get("user") or {}).get("login") or "unknown"
              base = (pr.get("base") or {}).get("ref") or "unknown"
              head = (pr.get("head") or {}).get("ref") or "unknown"
              url = pr.get("html_url") or ""

              verb = {
                  "opened": "opened",
                  "edited": "edited",
                  "reopened": "reopened",
                  "synchronize": "updated",
                  "ready_for_review": "ready for review",
                  "converted_to_draft": "converted to draft",
                  "review_requested": "review requested",
              }.get(action, action.replace("_", " "))
              template = "orange"
              if action == "closed":
                  verb = "merged" if pr.get("merged") else "closed"
                  template = "green" if pr.get("merged") else "grey"
              elif action in ("reopened", "ready_for_review"):
                  template = "orange"
              elif action == "synchronize":
                  template = "blue"
              elif action == "converted_to_draft":
                  template = "grey"

              title = truncate(f"Indigo GitHub | PR #{number} {verb}")
              elements = [
                  div(f"**{truncate(title_text, 120)}**"),
                  {
                      "tag": "column_set",
                      "flex_mode": "stretch",
                      "horizontal_spacing": "default",
                      "columns": [
                          stat_col(f"**Author**\n{user}"),
                          stat_col(f"**Branch**\n`{head}` -> `{base}`"),
                      ],
                  },
                  {
                      "tag": "column_set",
                      "flex_mode": "stretch",
                      "horizontal_spacing": "default",
                      "columns": [
                          stat_col(f"**Discussion**\n{(pr.get('comments') or 0) + (pr.get('review_comments') or 0)} comments"),
                          stat_col(f"**Files**\n{pr.get('changed_files') or 0} changed"),
                          stat_col(f"**Diff**\n+{pr.get('additions') or 0} / -{pr.get('deletions') or 0}"),
                      ],
                  },
              ]

              reviewer = payload.get("requested_reviewer") or {}
              if reviewer.get("login"):
                  elements.append(div(f"**Review requested**\n@{reviewer['login']}"))

              elements.append(note(f"Repository: `{repo_label()}`. Event: `{action}`."))

              actions = [action_button("Workflow run", run_url(), "default")]
              if url:
                  actions.insert(0, action_button("View PR", url, "primary"))
                  actions.insert(1, action_button("Files changed", f"{url}/files", "default"))
              elements.append({"tag": "action", "actions": actions[:3]})

              return {
                  "msg_type": "interactive",
                  "card": {
                      "header": {
                          "title": {"tag": "plain_text", "content": title},
                          "template": template,
                      },
                      "elements": elements,
                  },
              }


          def manual_card():
              repo = os.environ["GITHUB_REPOSITORY"]
              actor = os.environ.get("GITHUB_ACTOR", "unknown")
              return {
                  "msg_type": "interactive",
                  "card": {
                      "header": {
                          "title": {"tag": "plain_text", "content": "Indigo GitHub | Notification test"},
                          "template": "blue",
                      },
                      "elements": [
                          div("**GitHub Actions -> Feishu is ready.**"),
                          {
                              "tag": "column_set",
                              "flex_mode": "stretch",
                              "horizontal_spacing": "default",
                              "columns": [
                                  stat_col(f"**Repository**\n`{repo}`"),
                                  stat_col(f"**Actor**\n{actor}"),
                                  stat_col("**Mode**\nManual smoke test"),
                              ],
                          },
                          note("This flow uses GitHub Actions Secret `FEISHU_WEBHOOK_URL`; no repo webhook or Fly webhook is required."),
                          {"tag": "action", "actions": [action_button("Workflow run", run_url(), "primary")]},
                      ],
                  },
              }


          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              payload = json.load(event_file)

          event_name = os.environ["GITHUB_EVENT_NAME"]
          if event_name == "push":
              card = push_card(payload)
          elif event_name == "pull_request":
              card = pull_request_card(payload)
          elif event_name == "workflow_dispatch":
              card = manual_card()
          else:
              card = None

          if card is None:
              print(f"No notification needed for event {event_name}.")
              sys.exit(0)

          data = json.dumps(card).encode("utf-8")
          request = urllib.request.Request(
              os.environ["FEISHU_WEBHOOK_URL"],
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=10) as response:
                  response_body = response.read().decode("utf-8", "replace")
          except urllib.error.HTTPError as exc:
              print(exc.read().decode("utf-8", "replace"), file=sys.stderr)
              raise

          print(response_body)
          try:
              parsed = json.loads(response_body)
          except json.JSONDecodeError:
              parsed = {}

          status_code = parsed.get("StatusCode", parsed.get("code", 0))
          if status_code not in (0, None):
              raise SystemExit(f"Feishu webhook returned non-success response: {response_body}")
          PY
