name: Deploy Backend to Fly.io

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/fly-backend.yml"

concurrency:
  group: fly-backend-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure auth data volume exists
        run: |
          if ! flyctl volumes list --app indigo-ppt-backend | grep -q "indigo_data"; then
            flyctl volumes create indigo_data --app indigo-ppt-backend --region sin --size 1 --yes
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify image job Redis is configured
        run: |
          if ! flyctl secrets list --app indigo-ppt-backend | awk '$1 == "REDIS_URL" || $2 == "REDIS_URL" { found=1 } END { exit !found }'; then
            echo "REDIS_URL is missing. Run the Provision Image Job Infrastructure workflow before deploying."
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy backend
        working-directory: backend
        run: flyctl deploy --config fly.toml --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
