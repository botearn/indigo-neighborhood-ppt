app = "indigo-ppt-backend"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8000"

[env]
  ENV = "production"
  PORT = "8000"
  AUTH_DB_PATH = "/data/indigo.db"
  IMAGE_JOB_MEDIA_DIR = "/data/image-jobs"
  PUBLIC_BASE_URL = "https://indigo-ppt-backend.fly.dev"
  CORS_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,https://indigo-neighborhood-ppt.vercel.app"

[[mounts]]
  source = "indigo_data"
  destination = "/data"
  processes = ["app"]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
